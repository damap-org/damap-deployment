name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Stack validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: |
          for script in scripts/ci/*.sh scripts/deploy-local.sh scripts/update-runner.sh docker/runner/entrypoint.sh; do
            bash -n "$script"
          done

      - name: Validate runner versions and build image
        run: |
          python3 -B scripts/ci/check-runner-version.py
          docker build --pull -t damap-runner-ci docker/runner
          docker run --rm --entrypoint /opt/actions-runner/bin/Runner.Listener damap-runner-ci --version

      - name: Test local deployment safeguards
        run: |
          python3 -B scripts/ci/test_deploy_local.py
          python3 -B scripts/ci/test_update_runner.py

      - name: Start deployment and check readiness and routes
        run: bash scripts/ci/test-deployment.sh
