name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Stack validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: for script in scripts/ci/*.sh scripts/deploy-local.sh docker/runner/entrypoint.sh; do bash -n "$script"; done

      - name: Test local deployment safeguards
        run: python3 -B scripts/ci/test_deploy_local.py

      - name: Start deployment and check readiness and routes
        run: bash scripts/ci/test-deployment.sh
