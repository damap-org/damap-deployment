name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Stack validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: for script in scripts/ci/*.sh docker/runner/entrypoint.sh; do bash -n "$script"; done

      - name: Start deployment and check readiness and routes
        run: bash scripts/ci/test-deployment.sh

  connectivity:
    name: Server HTTPS reachability

    # Check the HTTPS reachability of the deployed DAMAP instance only on pushes to master.
    # PRs validate their own disposable stack.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      DAMAP_PUBLIC_URL: ${{ vars.DAMAP_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check server HTTPS reachability
        if: ${{ !cancelled() }}
        run: |
          : "${DAMAP_PUBLIC_URL:?Set the DAMAP_PUBLIC_URL repository variable}"
          if [[ "$DAMAP_PUBLIC_URL" != https://* ]]; then
            echo '::error::DAMAP_PUBLIC_URL must use HTTPS.'
            exit 1
          fi

          date -u

          curl --verbose --fail --show-error --connect-timeout 10 --max-time 20 -o /dev/null \
            --write-out '\nHTTPS result: remote=%{remote_ip} status=%{http_code} tcp=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
            "$DAMAP_PUBLIC_URL"
