name: Deploy demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: damap-demo-deploy
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'damap-org/damap-deployment' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the selected revision in an isolated stack
        run: bash scripts/ci/test-deployment.sh
  deploy:
    needs: test
    if: github.repository == 'damap-org/damap-deployment' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, damap-deploy]
    timeout-minutes: 20
    environment:
      name: demo
      url: https://damap.it.tuwien.ac.at
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Back up and deploy locally on the DAMAP VM
        env:
          TESTED_REVISION: ${{ github.sha }}
        run: bash scripts/deploy-local.sh "$DAMAP_DEPLOY_PATH" "$TESTED_REVISION" "$DAMAP_COMPOSE_PROJECT" "$DAMAP_BACKUP_DIR"
      - name: Verify public demo endpoints with valid TLS
        run: bash scripts/ci/smoke.sh https://damap.it.tuwien.ac.at
