services:
  nginx:
    build:
      # Use docker directory as context since ssl certificates are to be used from multiple services.
      # This way we can copy the certificates to the container while keeping them outside of a
      # specific service.
      context: ./docker
      dockerfile: ./nginx/Dockerfile
    container_name: "damap-nginx"
    restart: "unless-stopped"
    depends_on:
      - damap-frontend
      - damap-backend
      - keycloak
    environment:
      NGINX_HOSTNAME: ${NGINX_HOSTNAME:-localhost}
      HTTP_AUTH_USER: ${HTTP_AUTH_USER:-admin}
      HTTP_AUTH_PASSWORD: ${HTTP_AUTH_PASSWORD:-admin}
      # Fallback paths for test SSL certificate and key
      # When deploying to a live domain, use the Let's Encrypt volume path. See `example.env`.
      SSL_CERTIFICATE_PATH: ${SSL_CERTIFICATE_PATH:-/etc/nginx/ssl/test.crt}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/nginx/ssl/test.key}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - monitoring-report:/srv/report
      # Share Nginx logs with host for GoAccess analysis
      - ./docker/nginx/logs:/var/log/nginx
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint.sh
      # Share certbot files
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  damap-backend:
    build:
      context: ./docker/damap-be
      args:
        DAMAP_BE_VERSION: v4.7.0
    image: damap-org/damap-deployment-backend:v4.7.0
    container_name: "damap-backend"
    restart: "unless-stopped"
    depends_on:
      - postgres
      - keycloak
      - api-mock
      - fits-service
    environment:
      # --- Logging settings --- #
      QUARKUS_LOG_CATEGORY__IO_SMALLRYE_JWT_AUTH__LEVEL: DEBUG
      QUARKUS_LOG_CATEGORY__IO_SMALLRYE_JWT__LEVEL: DEBUG
      QUARKUS_LOG_CATEGORY__IO_QUARKUS__LEVEL: DEBUG
      QUARKUS_LOG_CATEGORY__ORG_ECLIPSE_MICROPROFILE__LEVEL: DEBUG
      QUARKUS_LOG_CATEGORY__ORG_JBOSS_RESTEASY_REACTIVE__LEVEL: DEBUG

      # --- General settings --- #
      DAMAP_ENV: ${DAMAP_ENV:-DEV}
      DAMAP_TENANT_AWARE_TITLE: ${DAMAP_TENANT_AWARE_TITLE:-DAMAP Tool}
      QUARKUS_HTTP_CORS_ORIGINS: "${DAMAP_QUARKUS_HTTP_CORS_ORIGINS:-https://localhost}"
      QUARKUS_PROFILE: ${DAMAP_QUARKUS_PROFILE:-}

      # --- Database settings --- #
      # Optional database configuration values, can be overridden by environment variables.
      # This is useful in case the database host/port/name are different from the defaults.
      # Prefixed with DAMAP_ (not Quarkus-specific), used to build the full JDBC URL.
      # NOTE: the database name has to match one of the values in POSTGRES_EXTRA_DBS in the postgres service below.
      DAMAP_DB_HOST: ${DAMAP_DB_HOST:-postgres}
      DAMAP_DB_NAME: ${DAMAP_DB_NAME:-damap}
      DAMAP_DB_PORT: ${DAMAP_DB_PORT:-}

      # --- Required database configuration values, must be set in the environment or .env file. ---
      QUARKUS_DATASOURCE_DB_KIND: ${DAMAP_DB_KIND:-postgresql}
      QUARKUS_DATASOURCE_PASSWORD: "${DAMAP_DB_PASSWORD:-damap}"
      QUARKUS_DATASOURCE_USERNAME: "${DAMAP_DB_USERNAME:-damap}"

      # --- OIDC / Auth settings --- #
      DAMAP_AUTH_ADMIN_ROLE_NAME: ${DAMAP_AUTH_ADMIN_ROLE_NAME:-Damap Admin}
      DAMAP_AUTH_AFFILIATIONS_CLAIM: ${DAMAP_AUTH_AFFILIATIONS_CLAIM:-affiliation}
      DAMAP_AUTH_EMAIL_CLAIM: ${DAMAP_AUTH_EMAIL_CLAIM:-email}
      DAMAP_AUTH_FAMILY_NAME_CLAIM: ${DAMAP_AUTH_FAMILY_NAME_CLAIM:-family_name}
      DAMAP_AUTH_GIVEN_NAME_CLAIM: ${DAMAP_AUTH_GIVEN_NAME_CLAIM:-given_name}
      DAMAP_AUTH_NAME_CLAIM: ${DAMAP_AUTH_NAME_CLAIM:-name}
      DAMAP_AUTH_SCOPE: ${DAMAP_AUTH_SCOPE:-openid profile email offline_access microprofile-jwt roles personID}
      DAMAP_AUTH_USER_ID_CLAIM: ${DAMAP_AUTH_USER_ID_CLAIM:-personID}
      DAMAP_AUTH_USER_ROLES_CLAIM_PATH: ${DAMAP_AUTH_USER_ROLES_CLAIM_PATH:-realm_access/roles}
      QUARKUS_OIDC_AUTH_SERVER_URL: "${DAMAP_QUARKUS_OIDC_AUTH_SERVER_URL:-http://keycloak:8080/auth/realms/damap}"
      QUARKUS_OIDC_CLIENT_ID: "${DAMAP_QUARKUS_OIDC_CLIENT_ID:-damap}"
      QUARKUS_OIDC_TOKEN_ISSUER: "${DAMAP_QUARKUS_OIDC_TOKEN_ISSUER:-https://localhost/auth/realms/damap}"

      # --- Settings for Person and Project services that DAMAP will connect to --- #
      # TODO: These should ideally be refactored to be more flexible and extensible,
      # e.g. by allowing to specify an arbitrary number of person services via a JSON array or similar.
      DAMAP_TENANT_AWARE_PERSON_SERVICES_0__DISPLAY_TEXT: ${DAMAP_TENANT_AWARE_PERSON_SERVICES_0__DISPLAY_TEXT:-Pure}
      DAMAP_TENANT_AWARE_PERSON_SERVICES_0__QUERY_VALUE: ${DAMAP_TENANT_AWARE_PERSON_SERVICES_0__QUERY_VALUE:-PURE}
      DAMAP_TENANT_AWARE_PERSON_SERVICES_0__CLASS_NAME: ${DAMAP_TENANT_AWARE_PERSON_SERVICES_0__CLASS_NAME:-org.damap.base.integration.pure.PurePersonService}
      DAMAP_TENANT_AWARE_PERSON_SERVICES_1__DISPLAY_TEXT: ${DAMAP_TENANT_AWARE_PERSON_SERVICES_1__DISPLAY_TEXT:-ORCID}
      DAMAP_TENANT_AWARE_PERSON_SERVICES_1__QUERY_VALUE: ${DAMAP_TENANT_AWARE_PERSON_SERVICES_1__QUERY_VALUE:-ORCID}
      DAMAP_TENANT_AWARE_PERSON_SERVICES_1__CLASS_NAME: ${DAMAP_TENANT_AWARE_PERSON_SERVICES_1__CLASS_NAME:-org.damap.base.integration.orcid.ORCIDPersonServiceImpl}
      DAMAP_TENANT_AWARE_PROJECT_SERVICE: ${DAMAP_TENANT_AWARE_PROJECT_SERVICE:-default}

      # --- Settings for REST services DAMAP connects to --- #
      DAMAP_REST_GOTENBERG_MP_REST_URL: ${DAMAP_REST_GOTENBERG_MP_REST_URL:-http://gotenberg:3000}

      # --- Fields settings --- #
      DAMAP_TENANT_AWARE_FIELDS_ETHICAL_REPORT_ENABLED: ${DAMAP_TENANT_AWARE_FIELDS_ETHICAL_REPORT_ENABLED:-true}

      # --- DAMAP PURE integration settings --- #
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_API_KEY: ${DAMAP_TENANT_AWARE_ELSEVIER_PURE_API_KEY:-""}
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_BACKEND: ${DAMAP_TENANT_AWARE_ELSEVIER_PURE_BACKEND:-file}
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_CONTRIBUTOR_ROLE_CLASSIFICATIONS_0__CONTRIBUTOR_ROLE: ${DAMAP_TENANT_AWARE_ELSEVIER_PURE_CONTRIBUTOR_ROLE_CLASSIFICATIONS_0__CONTRIBUTOR_ROLE:-PROJECT_MEMBER}
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_CONTRIBUTOR_ROLE_CLASSIFICATIONS_0__PURE_ROLE_URI: ${DAMAP_TENANT_AWARE_ELSEVIER_PURE_CONTRIBUTOR_ROLE_CLASSIFICATIONS_0__PURE_ROLE_URI:-/dk/atira/pure/member}
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_DESCRIPTION_CLASSIFICATION: ${DAMAP_TENANT_AWARE_ELSEVIER_PURE_DESCRIPTION_CLASSIFICATION:-/dk/atira/pure/projectdescription}
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_ENDPOINT_URL: ${DAMAP_TENANT_AWARE_ELSEVIER_PURE_ENDPOINT_URL:-""}
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_PERSONS_FILE: file:////opt/damap/config/pure-persons-data.json
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_PROJECT_LEAD_ROLE_CLASSIFICATION: ${DAMAP_TENANT_AWARE_ELSEVIER_PURE_PROJECT_LEAD_ROLE_CLASSIFICATION:-/dk/atira/pure/projectlead}
      DAMAP_TENANT_AWARE_ELSEVIER_PURE_PROJECTS_FILE: file:////opt/damap/config/pure-projects-data.json
    volumes:
      - ${DAMAP_PURE_PERSONS_FILE:-./docker/damap-be/pure/persons.json}:/opt/damap/config/pure-persons-data.json:ro
      - ${DAMAP_PURE_PROJECTS_FILE:-./docker/damap-be/pure/projects.json}:/opt/damap/config/pure-projects-data.json:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/q/health/live" ]
      interval: 30s
      timeout: 15s
      retries: 5

  damap-frontend:
    image: ghcr.io/damap-org/damap-frontend:4.7.0
    container_name: "damap-frontend"
    restart: "unless-stopped"
    depends_on:
      - damap-backend

  postgres:
    build:
      context: ./docker/postgres/
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-latest}
    container_name: "damap-postgres"
    restart: "unless-stopped"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_EXTRA_DBS: ${POSTGRES_EXTRA_DBS:-damap,keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}" ]
      interval: 30s
      timeout: 15s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-latest}
    container_name: "damap-keycloak"
    restart: "unless-stopped"
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_SCHEMA: public
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      # Must match one of the values in POSTGRES_EXTRA_DBS
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE:-keycloak}
      KC_DB_URL_HOST: postgres
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOST:-localhost}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/auth}
      KC_HTTPS_CERTIFICATE_FILE: /etc/pki/tls/certs/${KC_HTTPS_CERTIFICATE_FILE:-tls.crt}
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/pki/tls/private/${KC_HTTPS_CERTIFICATE_KEY_FILE:-tls.key}
      KC_PROXY: ${KC_PROXY:-edge}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/keycloak/export:/opt/keycloak/data/export
      - ./docker/keycloak/import/${KC_REALM_FILE:-damap-realm.json}:/opt/keycloak/data/import/realm.json:ro
      - ./docker/ssl/${KC_HTTPS_CERTIFICATE_FILE:-test.crt}:/etc/pki/tls/certs/tls.crt:ro
      - ./docker/ssl/${KC_HTTPS_CERTIFICATE_KEY_FILE:-test.key}:/etc/pki/tls/private/tls.key:ro
    command: start${KC_DEV_MODE:+-dev} --import-realm
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/8080 && \
           echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && \
           cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 15

  api-mock:
    image: clue/json-server
    restart: "unless-stopped"
    container_name: "damap-mock-api"
    command: db.json --routes routes.json
    volumes:
      - ./docker/api-mock/data/db.json:/data/db.json
      - ./docker/api-mock/data/routes.json:/data/routes.json
    ports:
      - "8091:80"

  fits-service:
    image: islandora/fits:main
    container_name: "damap-fits"
    restart: "unless-stopped"
    ports:
      - "8089:8080"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: "damap-gotenberg"
    restart: "unless-stopped"
    ports:
      - "3000:3000"

  certbot:
    image: certbot/certbot
    container_name: "damap-certbot"
    restart: "unless-stopped"
    depends_on:
      - nginx
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done;'

  # Monitoring service
  goaccess:
    build: ./docker/goaccess
    container_name: "damap-goaccess"
    restart: "unless-stopped"
    depends_on:
      - nginx
    environment:
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - monitoring-data:/srv/data
      - monitoring-report:/srv/report
      - ./docker/nginx/logs:/srv/logs
    ports:
      - "7890:7890"

volumes:
  db-data:
  monitoring-data:
  monitoring-report:
